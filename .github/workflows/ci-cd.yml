name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip
        run: python -m pip install --upgrade pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Flake8
        run: flake8 .

      - name: Collect static
        run: python manage.py collectstatic --noinput

      - name: Test coverage
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=80

  docker-build:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/oc-p13_oc-lettings:${{ github.sha }} .

      - name: Tag latest
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/oc-p13_oc-lettings:${{ github.sha }} \
                     ${{ secrets.DOCKERHUB_USERNAME }}/oc-p13_oc-lettings:latest

      - name: Push Docker image (sha)
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/oc-p13_oc-lettings:${{ github.sha }}

      - name: Push Docker image (latest)
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/oc-p13_oc-lettings:latest