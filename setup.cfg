[flake8]
max-line-length = 99
exclude = **/migrations/*,venv

[tool:pytest]
DJANGO_SETTINGS_MODULE = oc_lettings_site.settings
python_files = tests.py test_*.py *_tests.py
addopts = -v

[coverage:run]
omit =
    */migrations/*
    */__init__.py
    */settings.py
    */wsgi.py
    */asgi.py
    */admin.py
    */apps.py
    */tests/*
    manage.py

